<div class="cart-item pb-8 border-b border-gray-200" id="cart-item-{{ item.id }}">
    <div class="flex flex-col items-center">
        <div class="w-40 h-40 mb-4 flex items-center justify-center bg-gray-100">
            {% if item.product.main_image %}
                <img src="{{ item.product.main_image.url }}"
                     alt="{{ item.product.name }}"
                     class="max-h-full max-w-full object-contain">
            {% else %}
                <div class="w-full h-full flex items-center justify-center">
                    <span class="text-gray-400">No Image</span>
                </div>
            {% endif %}
        </div>

        <div class="text-center">
            <h3 class="font-bold text-sm">{{ item.product.name|upper }}</h3>
            <p class="text-xs">COLOR {{ item.product.color|upper }}</p>
            <p class="text-xs">SIZE {{ item.product_size.size.name }}</p>
            <p class="font-bold mt-1">${{ item.product.price }}</p>

            <!-- Quantity Controls -->
            <div class="flex items-center justify-center mt-2"
                 x-data="{ quantity: {{ item.quantity }}, maxStock: {{ item.product_size.stock }} }">
                <button class="w-6 h-6 flex items-center justify-center border border-gray-300 hover:bg-gray-100"
                        :class="{ 'opacity-50 cursor-not-allowed': quantity <= 1 }"
                        :disabled="quantity <= 1"
                        @click="if(quantity > 1) quantity--"
                        hx-post="{% url 'cart:update_item' item.id %}"
                        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                        hx-vals='js:{quantity: quantity}'
                        hx-target="#cart-modal"
                        hx-swap="outerHTML"
                        hx-trigger="click"
                        hx-on-after-request="console.log('Decreased quantity for item {{ item.id }}')">
                    −
                </button>
                <span class="mx-3 w-8 text-center" x-text="quantity">{{ item.quantity }}</span>
                <button class="w-6 h-6 flex items-center justify-center border border-gray-300 hover:bg-gray-100"
                        :class="{ 'opacity-50 cursor-not-allowed': quantity >= maxStock }"
                        :disabled="quantity >= maxStock"
                        @click="if(quantity < maxStock) quantity++"
                        hx-post="{% url 'cart:update_item' item.id %}"
                        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                        hx-vals='js:{quantity: quantity}'
                        hx-target="#cart-modal"
                        hx-swap="outerHTML"
                        hx-trigger="click"
                        hx-on-after-request="console.log('Increased quantity for item {{ item.id }}')">
                    +
                </button>
            </div>

            <!-- Remove button -->
            <button class="mt-2 text-xs text-gray-500 underline hover:text-gray-700"
                    hx-post="{% url 'cart:remove_item' item.id %}"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    hx-target="#cart-modal"
                    hx-swap="outerHTML"
                    hx-trigger="click"
                    hx-on-after-request="console.log('Removed item {{ item.id }}')">
                Remove
            </button>
        </div>
    </div>
</div>
